name: Browser tests

on:
  pull_request:
    branches: [main, codex/jest-starter-tests]

permissions:
  contents: read

jobs:
  student-journey:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lockfile was generated on macOS, so npm omits this Linux-only
      # optional binary even though Tailwind needs it on GitHub's runner.
      - name: Install Linux CSS binaries
        run: npm install --no-save lightningcss-linux-x64-gnu@1.31.1 @tailwindcss/oxide-linux-x64-gnu@4.2.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run student browser journey
        run: npm run test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
